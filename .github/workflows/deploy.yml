name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v3

      - name: 🔑 Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 🚀 Deploy to EC2 and Rebuild App
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          echo "======================================"
          echo "🚀 Starting CI/CD Deployment on EC2..."
          echo "======================================"

          cd /home/ubuntu/car-rental-app

          echo "🔄 Pulling latest code from GitHub..."
          git fetch origin main
          git reset --hard origin/main

          echo "⚙️ Rebuilding frontend from source..."
          cd frontend
          rm -rf build node_modules
          npm install
          npm run build
          cd ..

          echo "🔐 Generating backend .env file..."
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" > backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}" >> backend/.env
          echo "NODE_ENV=production" >> backend/.env

          echo "🧹 Cleaning up Docker..."
          sudo docker-compose down -v || true
          sudo docker system prune -a --volumes -f || true

          echo "🏗️ Building fresh Docker images..."
          sudo docker-compose build --no-cache

          echo "🌍 Starting containers..."
          sudo docker-compose up -d

          echo "✅ Deployment complete! App is live."
          EOF
