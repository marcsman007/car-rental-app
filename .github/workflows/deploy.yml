name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "======================================"
            echo "🚀 Starting CI/CD Deployment on EC2..."
            echo "======================================"

            cd ~/car-rental-app || git clone https://github.com/marcsman007/car-rental-app.git && cd car-rental-app

            echo "🔄 Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "⚙️ Ensuring required packages are installed..."
            if ! command -v npm &> /dev/null; then
              echo "Installing Node.js and npm..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            echo "🧹 Cleaning old Docker containers..."
            sudo docker compose down || true

            echo "📦 Rebuilding Docker images..."
            sudo docker compose build --no-cache

            echo "🚀 Starting containers..."
            sudo docker compose up -d

            echo "✅ Deployment complete!"
