name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 and Restart App
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd /home/ubuntu/car-rental-app
          git fetch origin main
          git reset --hard origin/main

          # Generate backend .env on EC2 with production secrets
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" > backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}" >> backend/.env
          echo "NODE_ENV=production" >> backend/.env

          # Rebuild all containers with sudo
          sudo docker-compose down
          sudo docker-compose up -d --build
          EOF
